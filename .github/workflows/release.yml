name: Release APK (Android arm64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Configure Flutter SDK path
        run: |
          echo "flutter.sdk=$(dirname "$(dirname "$(which flutter)")")" > local.properties
          echo "flutter.buildMode=release" >> local.properties

      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 7
          compression-level: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: Nightly ${{ github.sha }}
          body: |
            Automated nightly build from commit ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
